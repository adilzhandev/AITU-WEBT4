      <a class="project-name" href="index.html">

        Forms &amp; validation

      <nav class="site-nav" aria-label="Assignment sections">
        <div class="nav-links">

      <div class="student-info">
        <strong>Adilzhan Kuandykov</strong>

  <main class="page-width">
    <div class="page-heading">
      <div>
        <p class="section-number">PART 02</p>
        <h1>Bootstrap forms</h1>
      </div>
    </div>
    <div class="task-grid">
      <section class="task-card" aria-labelledby="bootstrap-title">
        <div class="task-intro">
          <p class="task-number">Task 02</p>
          <h2 class="task-title" id="bootstrap-title">Bootstrap form styling</h2>
        </div>
        <form id="bootstrap-form" aria-labelledby="bootstrap-title" class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="bootstrap-name">Name</label>
            <input type="text" id="bootstrap-name" name="name" class="form-control" placeholder="Your name" required minlength="2" maxlength="50" pattern=".*\S.*" autocomplete="name">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="bootstrap-email">Email</label>
            <input type="email" id="bootstrap-email" name="email" class="form-control" placeholder="you@example.com" required maxlength="100" autocomplete="email" aria-describedby="bootstrap-email-help">
            <div class="form-text" id="bootstrap-email-help">For example, alex@example.com.</div>
          </div>
          <div class="col-12">
            <label class="form-label" for="bootstrap-message">Message</label>
            <textarea id="bootstrap-message" name="message" class="form-control" placeholder="Write your message here" required minlength="10" maxlength="500" aria-describedby="bootstrap-message-help" rows="4"></textarea>
            <div class="form-text" id="bootstrap-message-help">Write 10–500 characters.</div>
          </div>
          <div class="col-12 form-actions">
            <button class="button" type="submit">Submit</button>
          </div>
          <p class="col-12 form-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
